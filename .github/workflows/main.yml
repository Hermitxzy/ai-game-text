name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'adventure-game-android/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build APK
      run: |
        cd adventure-game-android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: adventure-game-android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: adventure-game-android/app/build/outputs/apk/debug/app-debug.apk
        tag_name: v1.0
        name: v1.0 - 初版发布
        body: |
          ## 文字冒险游戏 Android 版 v1.0
          
          ### 功能特性
          - 完整的场景系统（3 个场景）
          - 背包管理（金币、物品）
          - 任务系统
          - 图形界面
          - 中文支持
          
          ### 文件信息
          - 大小：~5.4 MB
          - 架构：ARM64 (arm64-v8a), ARMv7 (armeabi-v7a)
          - 最低系统：Android 5.0 (API 21)
          
          ### 安装说明
          1. 下载 `app-debug.apk`
          2. 允许"未知来源"安装
          3. 点击安装
          
          ### 游戏玩法
          - help - 查看帮助
          - look - 查看当前场景
          - go [地点] - 移动
          - inventory - 查看背包
          - quest - 查看任务
          - exit - 退出

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
